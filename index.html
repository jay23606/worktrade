<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e6">
  <meta name="description" content="Trusted local communities exchange practical work through cash, barter, or both.">
  <meta name="application-name" content="WorkTrade">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WorkTrade">
  <title>WorkTrade — Work and value, exchanged openly</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <script>document.documentElement.dataset.theme=localStorage.getItem("worktrade:theme")||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")</script>
  <link rel="stylesheet" href="styles.css?v=20260813projects">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="brand" data-nav="discover" aria-label="WorkTrade home"><span class="brand-mark">W</span><span>WorkTrade</span></button>
    <nav aria-label="Primary">
      <button data-nav="discover">Discover</button><button data-nav="matches">Matches</button><button data-nav="messages">Messages <span class="nav-count" id="message-count"></span></button><button data-nav="workspace">My work</button><button data-nav="network">Community</button>
    </nav>
    <div class="account-cluster"><span class="demo-badge" id="mode-badge">Demo mode</span><button class="install-button" id="install-app" hidden>Install</button><button class="feedback-button" data-action="pilot-feedback" aria-label="Send pilot feedback" title="Send pilot feedback">Feedback</button><button class="theme-toggle" data-action="theme" aria-label="Switch color theme" title="Switch color theme"><span aria-hidden="true">◐</span></button><button class="notification-button" data-action="notifications" aria-label="Open notifications">●<span id="unread-count"></span></button><button class="avatar" data-nav="profile" aria-label="Open profile">JL</button></div>
  </header>
  <div class="connection-banner" id="connection-banner" role="status" aria-live="polite" hidden><span></span><button id="retry-connection">Try again</button></div>
  <div class="update-banner" id="update-banner" role="status" hidden><span>A newer WorkTrade version is ready.</span><button id="apply-update">Update now</button></div>
  <main id="main"></main>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js?v=20260813project-router"></script>
</body>
</html>
